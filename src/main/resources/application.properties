spring.application.name=gestion_csu
server.port=8080

# Database Configuration (H2 File-based to persist data)
spring.datasource.url=jdbc:h2:file:./data/csu_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
# Logs SQL désactivés par défaut (bruit + impact perf).
# Réactiver ponctuellement pour debug : --spring.jpa.show-sql=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security (JWT)
csu.security.jwt.secret=Q1NVX1NlY3JldEtleV9Gb3JfSldUX1ZhbGlkYXRpb25fTXVzdF9CZV9Mb25nX0Vub3VnaF8yNTZiaXQ=
csu.security.jwt.expiration=86400000

# === Synchronisation KoboToolbox ===
# Chaque enrôlement créé sur la plateforme est aussi poussé vers KoboToolbox
# (endpoint OpenRosa) en respectant le formulaire déployé.
kobo.enabled=true
# Endpoint OpenRosa du PROPRIETAIRE des formulaires (dasencsu2025).
# Les formulaires sont partages avec le compte du token (srsencsuthies2025) ;
# la soumission doit cibler l'espace du proprietaire, sinon: 404 "No XForm matches".
kobo.submission-url=${KOBO_SUBMISSION_URL:https://kc.kobotoolbox.org/dasencsu2025/submission}
# IMPORTANT : le token ne doit PAS rester en clair en production.
# Définissez la variable d'environnement KOBO_TOKEN ; sinon la valeur ci-dessous est utilisée.
kobo.token=${KOBO_TOKEN:cb5d34818bc195fcca5682c944ee94eb148918de}
# Formulaire cible : "THIES- Formulaire national adhésion familiale"
# (le nœud racine / id_string KoboCAT EST l'asset_uid)
kobo.asset-uid=${KOBO_ASSET_UID:abxHeF6pvaRNWHxmW5AQZT}
# Formulaire "THIES- Rajout de personnes à charge" (envoi manuel des dépendants)
kobo.asset-uid-rajout=${KOBO_ASSET_UID_RAJOUT:aVqGyLjLU3TCMdkjykNqJD}
